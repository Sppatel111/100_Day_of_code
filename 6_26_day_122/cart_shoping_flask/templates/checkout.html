<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <script src="https://js.stripe.com/v3/"></script>

</head>
<body>
    <h1>Checkout</h1>
    <form id="payment-form">
        <div id="card-element">
            <!-- A Stripe Element will be inserted here. -->
        </div>
        <button id="submit">Pay</button>
        <div id="payment-result"></div>
    </form>

    <script>
        const stripe = Stripe('{{ stripe_public_key }}'); // Replace with your actual public key
        const elements = stripe.elements();
        const cardElement = elements.create('card');
        cardElement.mount('#card-element');
        const form = document.getElementById('payment-form');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const { paymentMethod, error } = await stripe.createPaymentMethod({
                type: 'card',
                card: cardElement,
            });

            if (error) {
                document.getElementById('payment-result').innerText = error.message;
            } else {
                // Send paymentMethod.id and total amount to your server (Flask)
                fetch('/create-payment-intent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        payment_method_id: paymentMethod.id,
                        amount: {{ total_amount }}
                    }),
                }).then((response) => {
                    return response.json();
                }).then((data) => {
                    if (data.error) {
                        document.getElementById('payment-result').innerText = data.error;
                    } else {
                        document.getElementById('payment-result').innerText = 'Payment successful!';
                    }
                });
            }
        });


    </script>
</body>
</html>
