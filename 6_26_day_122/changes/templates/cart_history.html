<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
           integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
<h2> Cart history</h2>
<table class="table">
  <thead>
    <tr>
         <th scope="col">cart id</th>
      <th scope="col">quantity</th>
      <th scope="col">Product id</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
    {% for p in cart %}
    <tr>
      <td>{{p.id }}</td>
      <td>{{p.quantity }}</td>
      <td>{{ p.product_id }}</td>
      <td>
<!--        <a href="{{url_for('add') }}"><button>Add to Cart</button></a>-->
        <a href="{{url_for('view_history_product',id=p.product_id) }}"><button>View</button></a>
      </td>
    </tr>
  {% endfor %}

  </tbody>
</table>
</body>
</html>
