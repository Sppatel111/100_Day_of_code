<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
 <form method="POST" action="{{ url_for('login') }}">
    {{ form.csrf_token }}
     {{ form.hidden_tag() }}
    {{ form.email.label(placeholder='Email') }}
     {{ form.email(size=20) }}<br>
     {{ form.password.label(placeholder='Password') }}
     {{ form.password(size=20) }}<br>
     <p><input class="btn btn-default btn-submit" type="submit" value="Login"></p>

     <a href="{{url_for('signup')}}">Register</a>
</form>

</body>
</html>
