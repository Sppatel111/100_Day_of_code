<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>

<div>
       <a class="btn btn-primary" href="{{url_for('logout')}}" role="button">Logout</a>
   </div>

   <div>
       <a class="btn btn-primary" href="{{url_for('create_task')}}" role="button">Create Task</a>
   </div>
    <br>
<br>
    <form method="GET" action="{{ url_for('show') }}">
        <select name="status" onchange="this.form.submit()">
            <option value="all" {% if status_filter == 'all' %}selected{% endif %}>All</option>
            <option value="todo" {% if status_filter == 'todo' %}selected{% endif %}>To Do</option>
            <option value="active" {% if status_filter == 'active' %}selected{% endif %}>Active</option>
            <option value="completed" {% if status_filter == 'completed' %}selected{% endif %}>Completed</option>
        </select>
    </form>


<table class="table">
  <thead class="thead-light">
    <tr>
      <th scope="col">#</th>
      <th scope="col">Title</th>
      <th scope="col">Description</th>
        <th scope="col">Created at</th>
      <th scope="col">Status</th>
        <th scope="col">Due Date</th>
        <th scope="col">Priority</th>
        <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
    <tr>

        {% for t in task1 %}
        <tr>
            <td>{{t.id }}</td>
            <td>{{t.title}}</td>
            <td>{{t.description}}</td>
            <td>{{t.created_at}}</td>
            <td>{{t.is_completed}}</td>
            <td>{{t.due_date}}</td>
            <td>{{t.priority}}</td>
            <td>
                <a class="btn btn-primary" href="{{url_for('update_task',task_id=t.id)}}" role="button">Update</a>
                <a class="btn btn-primary" href="{{url_for('delete_task',id=t.id)}}" role="button">Delete</a>
            </td>
        <tr>
        {% endfor %}
    </tr>
  </tbody>
</table>
</body>
</html>
