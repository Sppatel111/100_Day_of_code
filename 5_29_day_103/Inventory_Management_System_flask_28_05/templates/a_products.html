<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
          crossorigin="anonymous">
</head>
<a href="{{url_for('add_products')}}"><button>Add Products</button></a>
<body>
<table class="table">
  <thead>
    <tr>
      <th scope="col">id</th>
      <th scope="col">Product Name</th>
      <th scope="col">Stocks</th>
      <th scope="col">Price</th>
        <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
  {% for p in products %}
    <tr>
      <td>{{p.id }}</td>
      <td>{{p.name }}</td>
      <td>{{p.stock }}</td>
        <td>{{p.price }}</td>
        <td>
            <a href="{{url_for('update', id=p.id)}}">Update</a><br>
            <a href="{{url_for('all_orders', id=p.id)}}">Orders</a>
        </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
</body>
</html>
