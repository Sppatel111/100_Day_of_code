<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
         integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
<a href="{{url_for('add_students' )}}"><button>ADD STUDENT</button></a>
<table class="table">
  <thead>
    <tr>
      <th scope="col">id</th>
      <th scope="col">Enrollment No.</th>
      <th scope="col">Name</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
  {% for s in student %}
    <tr>
      <td>{{s.id}}</td>
      <td>{{s.enroll_id }}</td>
      <td>{{s.full_name }}</td>
        <td>
          <a href="{{url_for('view_student',id=s.id )}}"><button>View</button></a>
          <a href="{{url_for('score_card',id=s.id )}}"><button>Scored Card</button></a>
        </td>
    </tr>
  {% endfor %}
  </tbody>
</table>

</body>
</html>
