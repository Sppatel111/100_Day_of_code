<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  </head>
</head>
<body>
<h2 class="text-center"> ZOO ANIMALS</h2>
<table class="table">
  <thead>
    <tr>
      <th scope="col">ID</th>
      <th scope="col">NAME</th>
      <th scope="col">SPECIES</th>
      <th scope="col">TYPE</th>
       <th scope="col">SOUND</th>
      <th scope="col">STATUS</th>
      <th scope="col">ACTION</th>
    </tr>
  </thead>
  <tbody>
  {% for a in a1 %}
    <tr>
      <td>{{a.id}}</td>
      <td>{{a.name }}</td>
      <td>{{ a.species }}</td>
        <td>{{ a.type }}</td>
        <td>{{ a.sound }}</td>
        <td>{{ a.status }}</td>
      <td>
        <a href="{{url_for('update',id=a.id )}}">Update Status</a>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>

</body>
</html>
