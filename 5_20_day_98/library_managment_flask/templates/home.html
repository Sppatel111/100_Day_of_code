<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
<h1> Home</h1>
  <a href="{{url_for('logout') }}" type=" button">Logout</a>
  <br>
  <a href="{{url_for('history') }}" type=" button">History</a>
  <table class="table">
  <thead>
    <tr>
      <th scope="col">id</th>
      <th scope="col">Book Name</th>
      <th scope="col">Status</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
   {% for b in all_books %}
    <tr>
      <td>{{b.id}}</td>
      <td>{{b.name}}</td>
      <td>{{b.status}}</td>
      <td>
        <a href="{{url_for('borrow',id=b.id)}}" type="submit" >Borrow</a>
      </td>
    </tr>
   {% endfor %}
  </tbody>
</table>
</body>
</html>
