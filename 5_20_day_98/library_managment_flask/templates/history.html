<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
<h1> History </h1>
<a href="{{url_for('logout') }}" type=" button">Logout</a>
  <table class="table">
  <thead>
    <tr>
        <th scope="col">id</th>
      <th scope="col">Book id</th>
      <th scope="col">Borrow Date</th>
      <th scope="col">Return Date</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
   {% for b in history %}
    <tr>
        <td>{{b.id}}</td>
      <td>{{b.book_id}}</td>
      <td>{{b.taken_date}}</td>
      <td>{% if b.return_date == None %}
             <p>not return yet</p>
          {%else %}
             {{ b.return_date }}
          {% endif %}
      </td>
      <td>
        <a href="{{url_for('show',id=b.book_id)}}" type="submit" >Show</a><br>
          <a href="{{url_for('return_book',id=b.id)}}" type="submit" >Return</a>
      </td>
    </tr>
   {% endfor %}
      </table>
</body>
</html>
